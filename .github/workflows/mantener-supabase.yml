# Supabase (plan gratis) pausa los proyectos tras ~7 días sin actividad.
# Este flujo hace una consulta liviana cada 3 días para mantenerlo activo.
# Lee la URL y la clave publicable desde config.js (son datos públicos; la seguridad la da RLS).
name: Mantener Supabase activo
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar la API
        run: |
          URL=$(grep -oE "supabaseUrl: *'[^']+'" config.js | cut -d"'" -f2)
          KEY=$(grep -oE "supabaseAnonKey: *'[^']+'" config.js | cut -d"'" -f2)
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/notes?select=id&limit=1" -H "apikey: $KEY")
          echo "Respuesta: $code"
          # Cualquier respuesta del servidor (incluso 401/403 por la seguridad) cuenta como actividad.
          test "$code" -gt 0 && test "$code" -lt 500
